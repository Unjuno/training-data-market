# Deliberately bound to loopback: this is an OPERATOR/STAGING deployment.
# Do not expose the unauthenticated browser-session pilot directly to the Internet.
services:
  api:
    build: .
    command: ["uvicorn", "backend.service:get_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      TDM_STATE_ROOT: /state
      TDM_DATA_ROOT: /data
      TDM_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:${TDM_LOCAL_PORT:-8000}:8000"]
    volumes:
      - ./state:/state
      - ./data:/data:ro
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "backend.worker", "--data-root", "/data", "--state-root", "/state"]
    env_file: [.env]
    environment:
      TDM_STATE_ROOT: /state
      TDM_DATA_ROOT: /data
    volumes:
      - ./state:/state
      - ./data:/data:ro
    restart: unless-stopped
